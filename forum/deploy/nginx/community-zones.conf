# http-контекст: /etc/nginx/conf.d/proektmap-community-zones.conf
# Вход на форум и SSO: не больше 30 запросов в минуту с одного IP (плюс burst в location).
limit_req_zone $binary_remote_addr zone=pm_community_auth:10m rate=30r/m;
# Служебные страницы форума не индексируются (пустое значение заголовок не ставит).
map $request_uri $pm_forum_robots {
    default "";
    ~^/community/(admin|api|auth|settings|notifications|logout) "noindex, nofollow";
}
# Регистрация и подтверждение email на сайте: против массовых аккаунтов для спама на форуме.
limit_req_zone $binary_remote_addr zone=pm_site_register:10m rate=5r/m;
