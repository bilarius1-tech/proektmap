# ИИ Форум (Flarum 2) на https://proektmap.ru/community
# Ставится в /etc/nginx/proektmap/community.conf и подключается внутри server { server_name proektmap.ru; }
# ДО `location /` (прокси в Next.js). Подробности: docs/forum-architecture.md

# Доступ: /etc/nginx/proektmap/community-gate.conf. Открыт = community-gate.open.conf, закрытая бета = community-gate.conf.

location = /community {
    include /etc/nginx/proektmap/community-gate.conf;
    rewrite ^ /community/index.php last;
}

location ^~ /community/ {
    include /etc/nginx/proektmap/community-gate.conf;

    root /var/www/www-root/data/www/proektmap-forum-web;
    index index.php;
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~* ^/community/assets/.+\.(?:css|js|woff2?|svg|png|jpe?g|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /community/auth/ {
        limit_req zone=pm_community_auth burst=20 nodelay;
        include /etc/nginx/proektmap/community-gate.conf;
        rewrite ^ /community/index.php last;
    }

    location = /community/index.php {
        add_header X-Robots-Tag $pm_forum_robots always;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/www-root/data/www/proektmap-forum/public/index.php;
        fastcgi_param SCRIPT_NAME /community/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/var/www/php-fpm/26.sock;
        fastcgi_read_timeout 60s;
    }

    # Никакой другой PHP из public не исполняется.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    try_files $uri $uri/ /community/index.php?$query_string;
}
