server {
	server_name reverans.online www.reverans.online;
	charset off;
	include /etc/nginx/vhosts-includes/*.conf;
	include /etc/nginx/vhosts-resources/reverans.online/*.conf;
	include /etc/nginx/users-resources/www-root/*.conf;
	access_log /var/www/httpd-logs/reverans.online.access.log;
	error_log /var/www/httpd-logs/reverans.online.error.log notice;
	set $root_path /var/www/www-root/data/www/reverans.online;
	root $root_path;
	listen 159.194.228.226:80;

	gzip on;
	gzip_comp_level 5;
	gzip_disable "msie6";
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;


	location ^~ /tz/ {
		alias /var/www/reverans/tz/;
		autoindex on;
		include /etc/nginx/mime.types;
		default_type text/plain;
		add_header Content-Disposition inline;
	}

	# User uploads — serve from disk (Next does not pick up new public/ files after start)
	location ^~ /uploads/ {
		alias /var/www/reverans/web/public/uploads/;
		access_log off;
		expires 30d;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}


	location / {
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_read_timeout 60s;
		proxy_pass http://127.0.0.1:3050;
	}
}

server {
	server_name reverans.online www.reverans.online;
	ssl_certificate "/var/www/httpd-cert/www-root/reverans.online_le1.crtca";
	ssl_certificate_key "/var/www/httpd-cert/www-root/reverans.online_le1.key";
	ssl_ciphers EECDH:+AES256:-3DES:RSA+AES:!NULL:!RC4;
	ssl_prefer_server_ciphers on;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_dhparam /etc/ssl/certs/dhparam4096.pem;
	charset off;
	include /etc/nginx/vhosts-includes/*.conf;
	include /etc/nginx/vhosts-resources/reverans.online/*.conf;
	include /etc/nginx/users-resources/www-root/*.conf;
	access_log /var/www/httpd-logs/reverans.online.access.log;
	error_log /var/www/httpd-logs/reverans.online.error.log notice;
	set $root_path /var/www/www-root/data/www/reverans.online;
	root $root_path;
	listen 159.194.228.226:443 ssl;

	gzip on;
	gzip_comp_level 5;
	gzip_disable "msie6";
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;


	location ^~ /tz/ {
		alias /var/www/reverans/tz/;
		autoindex on;
		include /etc/nginx/mime.types;
		default_type text/plain;
		add_header Content-Disposition inline;
	}

	# User uploads — serve from disk (Next does not pick up new public/ files after start)
	location ^~ /uploads/ {
		alias /var/www/reverans/web/public/uploads/;
		access_log off;
		expires 30d;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}


	location / {
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_read_timeout 60s;
		proxy_pass http://127.0.0.1:3050;
	}
}
